{% extends 'menu/base.html' %}

{% block content %}
<div class="mt-4 ms-4" style="max-width:600px;">
    <h1 class="fw-bold mb-4" style="font-size:2.8rem;">새 메뉴 등록</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_name" class="form-label">메뉴 이름</label>
            {{ form.name }}
        </div>
        <div class="mb-3">
            <label for="id_description" class="form-label">메뉴 설명</label>
            {{ form.description }}
        </div>
        <div class="mb-3">
            <label for="id_price" class="form-label">가격</label>
            {{ form.price }}
        </div>
        <div class="mb-3">
            <label for="id_total_servings" class="form-label">총 준비 수량</label>
            {{ form.total_servings }}
        </div>
        <div class="mb-4">
            <label for="id_image" class="form-label">메뉴 이미지</label>
            {{ form.image }}
        </div>
        <button type="submit" class="btn btn-primary me-2">저장</button>
        <a href="{% url 'menu_list' %}" class="btn btn-secondary">취소</a>
    </form>
</div>
{% endblock %}
