{% extends 'menu/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>메뉴 삭제</h2>
    <p>정말로 "{{ menu.name }}" 메뉴를 삭제하시겠습니까?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">삭제</button>
        <a href="{% url 'menu_list' %}" class="btn btn-secondary">취소</a>
    </form>
</div>
{% endblock %}
